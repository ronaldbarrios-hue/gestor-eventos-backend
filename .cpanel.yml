---
# Despliegue en cPanel (Git Version Control → "Deploy HEAD Commit").
#
# El repositorio YA está clonado directamente en la carpeta de la app
# ("Application root" = gestek-api), así que no hace falta copiar nada de
# un lado a otro — solo instalar dependencias y reiniciar.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/gestek-api
    # 0 · Qué commit es este, para que /health lo pueda leer.
    - /bin/bash -lc 'cd "$DEPLOYPATH" && git rev-parse HEAD > COMMIT.txt'
    # 1 · Las dependencias
    - /bin/bash -lc 'cd "$DEPLOYPATH" && npm ci --omit=dev --no-audit --no-fund'
    # 2 · El reinicio. Passenger recarga cuando cambia este archivo.
    - /bin/bash -lc 'mkdir -p "$DEPLOYPATH/tmp" && touch "$DEPLOYPATH/tmp/restart.txt"'
